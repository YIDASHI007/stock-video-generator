name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      CI: "true"
      RELEASE_REPOSITORY: "YIDASHI007/stock-video-generator-releases"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,build]"
          dotnet tool install --global vpk --version 1.2.0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test and package
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest -q
          .\scripts\build-windows-release.ps1 `
            -Version "${{ steps.version.outputs.value }}" `
            -UpdateRepoUrl "https://github.com/${{ env.RELEASE_REPOSITORY }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockVideoGenerator-${{ steps.version.outputs.value }}-windows
          path: build/windows-${{ steps.version.outputs.value }}/Releases/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            build/windows-${{ steps.version.outputs.value }}/Releases/* `
            --repo "${{ env.RELEASE_REPOSITORY }}" `
            --generate-notes `
            --title "股票视频工作台 ${{ steps.version.outputs.value }}"
