name: Publish source release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
          pnpm install --frozen-lockfile

      - name: Verify source release
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m ruff check apps/api/src
          .\.venv\Scripts\python.exe -m pytest -q
          pnpm -r test

      - name: Publish source release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $notes = "docs/RELEASE_NOTES_$version.md"
          if (Test-Path -LiteralPath $notes) {
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "社媒工作台 ${{ github.ref_name }}" --notes-file $notes
          } else {
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "社媒工作台 ${{ github.ref_name }}" --generate-notes
          }
